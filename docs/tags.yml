# Controlled vocabulary for sample tags. `onInlineTags: 'throw'` in
# docusaurus.config.ts means a tag missing from this file fails the build,
# so a typo can't quietly create a one-item category.

# --- content type ---
how-to:
  label: How-to
  permalink: /type/how-to
  description: >-
    Task-based documents that take a reader from a starting state to a verified
    result, with numbered steps.

tutorial:
  label: Tutorial
  permalink: /type/tutorial
  description: >-
    Learning-oriented walkthroughs that build one working thing end to end,
    rather than solving a single task in isolation.

concept:
  label: Concept
  permalink: /type/concept
  description: >-
    Documents that explain how something works and why, so a reader can make a
    decision. No steps to follow.

reference:
  label: Reference
  permalink: /type/reference
  description: >-
    Lookup-oriented documents — tables, matrices, and exhaustive descriptions
    read out of order rather than start to finish.

quick-start:
  label: Quickstart
  permalink: /type/quick-start
  description: >-
    Documents that map a whole area and hand the reader off to the detailed
    documents underneath.

# --- product ---
logos:
  label: Logos
  permalink: /product/logos
  description: Developer documentation for Logos Core and the Logos Execution Zone.

status:
  label: Status
  permalink: /product/status
  description: Help-centre articles for the Status messaging and wallet app.

keycard:
  label: Keycard
  permalink: /product/keycard
  description: Help-centre articles for Keycard Shell, a hardware wallet and transaction signer.

# --- topic ---
hardware:
  label: Hardware
  permalink: /topic/hardware
  description: >-
    Documents about physical devices — the Keycard Shell signer and the card
    itself — rather than software alone.
